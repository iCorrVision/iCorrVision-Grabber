[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "icorrvision-grabber"
version = "2.0.0"
description = "Multi-camera image acquisition for digital image correlation with a PySide6 interface"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "João Pedro da Silva Duarte Récio" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.10.2",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "typing_extensions",
]

[project.optional-dependencies]
# Allied Vision cameras. VmbPy also needs the Vimba X SDK installed (see README).
allied = ["vmbpy"]
# Benchmark notebook and synthetic images (benchmarks/).
notebooks = ["jupyterlab", "pandas>=2.1.0", "matplotlib>=3.8.0", "scipy>=1.12.0"]
dev = ["black"]

[project.urls]
Repository = "https://github.com/iCorrVision/iCorrVision-Grabber"

[tool.setuptools.packages.find]
where = ["src"]
